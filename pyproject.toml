[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kw-yt-transcript"
version = "0.1.0"
description = "Консольная утилита для получения метаданных и транскриптов видео YouTube"
readme = "SPEC.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "yt-dlp>=2026.8.19",
  "youtube-transcript-api==1.2.4",
]

[project.optional-dependencies]
asr = ["faster-whisper==1.2.1"]

[project.scripts]
kw-yt = "kw_yt_transcript.cli:main"

[tool.setuptools.packages.find]
include = ["kw_yt_transcript*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
