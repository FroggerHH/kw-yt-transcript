[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kw-yt-transcript"
version = "0.1.0"
description = "Консольная утилита для получения метаданных и транскриптов видео YouTube"
readme = "README.md"
requires-python = ">=3.11"  # >=3.11: stdlib tomllib нужен для config.py (волна 2, без новых зависимостей)
license = { text = "MIT" }
keywords = ["youtube", "transcript", "subtitles", "transkriptsia", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Utilities",
]
dependencies = [
  "yt-dlp>=2026.8.19",
  "youtube-transcript-api==1.2.4",
]

[project.optional-dependencies]
asr = ["faster-whisper==1.2.1"]

[project.scripts]
kw-yt = "kw_yt_transcript.cli:main"

[tool.setuptools.packages.find]
include = ["kw_yt_transcript*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
