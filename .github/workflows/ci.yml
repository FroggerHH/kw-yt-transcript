name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run --locked --with pytest -- python -m pytest -q -p no:cacheprovider
      - run: uvx ruff@0.14.5 check kw_yt_transcript tests
      - run: uvx ruff@0.14.5 format --check kw_yt_transcript tests
      - run: uvx mypy@1.18.2 kw_yt_transcript --ignore-missing-imports --follow-imports=skip
